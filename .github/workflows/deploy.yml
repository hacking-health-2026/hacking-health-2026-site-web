name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read GitHub Pages paths
        id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - name: Check static path mappings
        run: node scripts/check-paths.mjs
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Report API configuration
        if: ${{ vars.VITE_API_BASE_URL == '' }}
        run: echo "::warning::VITE_API_BASE_URL is empty. Pages and bundled presets will deploy, but product search and analysis require a separately hosted backend and matching CORS_ORIGINS."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
